        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .squish-active:active {
            transform: scale(0.96);
        }
        .rotated-badge {
            transform: rotate(-2deg);
        }
    </style>

    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-base overflow-x-hidden">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-margin-mobile h-16 pt-base bg-surface dark:bg-on-background docked full-width top-0 z-50">
<div class="flex items-center gap-xs">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center overflow-hidden">
<img alt="Broomba AI Character" class="w-full h-full object-cover" data-alt="A charming and expressive cartoonish robot character representing a smart vacuum. The character has a friendly digital screen face with glowing blue eyes, styled in a high-energy vibrant digital art aesthetic with soft purple lighting and a premium 3D finish. The background is a clean, minimalist studio setting with high-key lighting that emphasizes its sleek, rounded design." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCX35-OVhAHLOtBdMpAL4OsfXsxNQNdh0lu42dZB1GkdGGIe08Kp0gdjxT3CsTfkmBDaJ4NNfX8Oq2KDsywcGSCv_2EZP-kt6TExGca2tjA5PvMHipurE2zXXs1FpI6m2CQUWelpQQgdLlD4o7zudGXOD8FnBhztlkpeTpEtzisI9iiL0ula5JrThR6GuKq537LyGmUSdj6Hb0MoQh9QbFUWxU1YYGCAs2L2INBlEkb99PbmmMo8O-Elh2RL9UW5KTeYs720dkWaso"/>
</div>
<h1 class="font-h1 text-h1 font-black text-primary dark:text-primary-fixed tracking-tighter">Broomba</h1>
</div>
<button class="material-symbols-outlined text-primary dark:text-primary-fixed hover:opacity-80 transition-opacity text-[32px] Active: scale-95 transition-transform duration-150" data-icon="face_retouching_natural">
            face_retouching_natural
        </button>
</header>
<main class="flex-grow px-margin-mobile pt-lg pb-xl max-w-md mx-auto w-full">
<!-- Back Action -->
<button class="flex items-center gap-xs text-on-surface-variant font-body-lg mb-md squish-active transition-all">
<span class="material-symbols-outlined">arrow_back</span>
<span>Back</span>
</button>
<!-- Header Section -->
<div class="mb-lg">
<div class="inline-block bg-tertiary-container text-on-tertiary-container px-sm py-xs rounded-full font-label-caps text-label-caps rotated-badge mb-base">
                JUDGMENT TIME
            </div>
<h2 class="font-h2 text-h2 text-on-surface leading-none">Which room are we judging today?</h2>
</div>
<!-- Room Selection Bento Grid -->
<div class="grid grid-cols-2 gap-md mb-xl">
<!-- Kitchen -->
<button class="col-span-1 group flex flex-col items-center justify-center bg-surface-container-low p-md rounded-lg shadow-[0_8px_30px_rgba(110,61,255,0.08)] squish-active transition-all hover:bg-primary-fixed">
<div class="w-16 h-16 rounded-full bg-primary-container flex items-center justify-center mb-sm group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-on-primary-container text-[32px]" data-icon="kitchen">kitchen</span>
</div>
<span class="font-h3 text-h3 text-on-surface">Kitchen</span>
</button>
<!-- Living Room -->
<button class="col-span-1 group flex flex-col items-center justify-center bg-surface-container-low p-md rounded-lg shadow-[0_8px_30px_rgba(110,61,255,0.08)] squish-active transition-all hover:bg-secondary-fixed">
<div class="w-16 h-16 rounded-full bg-secondary-container flex items-center justify-center mb-sm group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-on-secondary-container text-[32px]" data-icon="chair">chair</span>
</div>
<span class="font-h3 text-h3 text-on-surface">Living</span>
</button>
<!-- Bedroom -->
<button class="col-span-1 group flex flex-col items-center justify-center bg-surface-container-low p-md rounded-lg shadow-[0_8px_30px_rgba(110,61,255,0.08)] squish-active transition-all hover:bg-tertiary-fixed">
<div class="w-16 h-16 rounded-full bg-tertiary-container flex items-center justify-center mb-sm group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-on-tertiary-container text-[32px]" data-icon="bed">bed</span>
</div>
<span class="font-h3 text-h3 text-on-surface">Bedroom</span>
</button>
<!-- Bathroom -->
<button class="col-span-1 group flex flex-col items-center justify-center bg-surface-container-low p-md rounded-lg shadow-[0_8px_30px_rgba(110,61,255,0.08)] squish-active transition-all hover:bg-primary-fixed-dim">
<div class="w-16 h-16 rounded-full bg-primary flex items-center justify-center mb-sm group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-on-primary text-[32px]" data-icon="bathtub">bathtub</span>
</div>
<span class="font-h3 text-h3 text-on-surface">Bathroom</span>
</button>
<!-- Other -->
<button class="col-span-2 group flex items-center justify-center bg-surface-container-low p-md rounded-lg shadow-[0_8px_30px_rgba(110,61,255,0.08)] squish-active transition-all hover:bg-surface-variant">
<div class="w-12 h-12 rounded-full bg-on-surface-variant flex items-center justify-center mr-md group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-surface text-[24px]" data-icon="more_horiz">more_horiz</span>
</div>
<span class="font-h3 text-h3 text-on-surface">Something Else</span>
</button>
</div>
<!-- Call to Action -->
<div class="relative flex flex-col items-center gap-md">
<!-- Cam Shutter Style Button -->
<button class="w-32 h-32 rounded-full bg-primary p-xs shadow-[0_20px_50px_rgba(85,14,231,0.3)] squish-active group">
<div class="w-full h-full rounded-full border-4 border-on-primary border-dashed flex flex-col items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-[48px] mb-xs group-hover:rotate-12 transition-transform" data-icon="photo_camera" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</div>
</button>
<div class="text-center">
<h3 class="font-h3 text-h3 text-primary">Upload Photo</h3>
<p class="text-on-surface-variant font-body-base">Let Broomba see the mess</p>
</div>
</div>
<!-- Subtle "Judgment" Tease -->
<div class="mt-xl p-md bg-surface-container-high rounded-lg border-2 border-primary/10 flex items-start gap-md">
<span class="material-symbols-outlined text-primary text-[32px]" data-icon="smart_toy">smart_toy</span>
<div>
<p class="font-body-lg text-on-surface italic">"I've seen cleaner garage floors than what you're about to show me, haven't I?"</p>
<p class="text-label-caps font-label-caps text-on-surface-variant mt-base">BROOMBA AI IS READY</p>
</div>
</div>
</main>
<!-- BottomNavBar (Suppressed due to task-focused flow as per Shell Visibility Rule, but keeping structure if needed for top-level) -->
<!-- The prompt implies this is a specific action screen (Room Check), navigation is omitted to focus on the upload task. -->
